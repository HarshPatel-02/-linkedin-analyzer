<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LI Analyzer</title>
<style>
  :root {
    --bg:#ffffff; --surface:#f6f8fa; --fg:#111827; --fg-2:#374151; --muted:#6b7280;
    --border:#e5e7eb; --blue:#0a66c2; --purple:#7c3aed; --green:#059669; --bad:#dc2626;
    --input:#ffffff; --chip:#eef2ff; --on-purple:#ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1b1f23; --surface:#23282d; --fg:#e8eaed; --fg-2:#c9ced6; --muted:#9aa0a6;
      --border:#383e45; --blue:#70b5f9; --purple:#a78bfa; --green:#34d399; --bad:#f87171;
      --input:#2b3136; --chip:#2e2a47;
      --on-purple:#1b1f23;   /* white on the light dark-mode purple is ~2.7:1 */
    }
  }
  * { box-sizing: border-box; }
  body { width: 380px; margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 12px 14px 0; }
  h1 { margin: 0 0 10px; font-size: 14px; font-weight: 800; letter-spacing: .2px; }
  h1 span { color: var(--purple); }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); }
  nav button { flex: 1; padding: 8px 4px; border: 0; border-bottom: 2px solid transparent; background: none;
               color: var(--muted); font: inherit; font-weight: 700; cursor: pointer; }
  nav button.on { color: var(--purple); border-bottom-color: var(--purple); }
  nav .count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px;
               background: var(--purple); color: var(--on-purple); font-size: 11px; line-height: 18px; }
  main { padding: 12px 14px 14px; max-height: 470px; overflow-y: auto; }
  section[hidden] { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 9px 11px; margin-bottom: 8px; }
  .card .name { font-weight: 700; color: var(--fg); }
  .card .meta { color: var(--muted); font-size: 11.5px; margin: 1px 0 4px; }
  .card .text { color: var(--fg-2); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .card .actions { display: flex; gap: 6px; margin-top: 7px; }
  .chip { display: inline-block; padding: 0 7px; border-radius: 999px; background: var(--chip); color: var(--fg-2);
          font-size: 11px; font-weight: 700; margin-right: 4px; }
  button.btn { padding: 5px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--input);
               color: var(--fg-2); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  button.btn:hover { border-color: var(--purple); color: var(--purple); }
  button.btn.primary { background: var(--purple); border-color: var(--purple); color: var(--on-purple); }
  button.btn.primary:hover { color: var(--on-purple); filter: brightness(1.08); }
  button.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  label { display: block; font-weight: 700; font-size: 12px; margin: 10px 0 3px; color: var(--fg-2); }
  label span { font-weight: 400; color: var(--muted); }
  input, textarea, select { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
                    background: var(--input); color: var(--fg); font: inherit; }
  textarea { min-height: 54px; resize: vertical; }
  input[type=number] { width: 64px; }
  .status { min-height: 18px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  /* Keyboard focus, fields, scrollbar, selection — themed, not browser defaults */
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  input:focus, textarea:focus, select:focus { border-color: var(--purple); }
  main { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  main::-webkit-scrollbar { width: 6px; }
  main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::selection { background: color-mix(in srgb, var(--purple) 28%, transparent); }
  button.btn svg { vertical-align: -2px; margin-right: 4px; }
  .empty { padding: 18px 8px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>LinkedIn <span>AI</span> Analyzer</h1>
    <nav>
      <button type="button" data-tab="followups" class="on">Follow-ups<span class="count" id="due-count" hidden></span></button>
      <button type="button" data-tab="leads">Leads</button>
      <button type="button" data-tab="pitch">My pitch</button>
    </nav>
  </header>
  <main>
    <section id="tab-followups">
      <div class="row">
        <span class="muted">Remind me when there's no reply after</span>
        <span><input type="number" id="followup-days" min="1" max="30"> <span class="muted">days</span></span>
      </div>
      <div id="due-list"></div>
      <div class="muted" id="waiting-line"></div>
    </section>

    <section id="tab-leads" hidden>
      <div class="row">
        <span class="muted" id="lead-count"></span>
        <span>
          <button type="button" class="btn primary" id="export-csv"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M4.5 7.5 8 11l3.5-3.5M3 13.5h10"/></svg>Export CSV</button>
          <button type="button" class="btn danger" id="clear-leads">Clear</button>
        </span>
      </div>
      <div id="lead-list"></div>
    </section>

    <section id="tab-pitch" hidden>
      <div class="muted">Set this up once. It applies to every AI note and suggestion — chat ✨ replies, connection notes and the Suggested outreach on score panels. Tone is picked per message, on the AI note itself.</div>
      <form id="pitch-form">
        <label for="p-who">Your position / role <span>(you, the sender)</span></label>
        <input id="p-who" placeholder="Founder of a healthcare IT company">
        <label for="p-expertise">Your expertise</label>
        <input id="p-expertise" placeholder="healthcare tech experts">
        <label for="p-offer">Your offer <span>(one line)</span></label>
        <input id="p-offer" placeholder="if you need anything in tech, we can help">
        <label for="p-services">Services <span>(optional — what you actually build)</span></label>
        <textarea id="p-services" placeholder="EHR integrations, patient portals, HIPAA-compliant apps…"></textarea>
        <label for="p-casual_opener">Casual first message <span>(✨ keeps this core line)</span></label>
        <textarea id="p-casual_opener"></textarea>
        <div class="row" style="margin-top:10px;">
          <span class="status" id="pitch-status"></span>
          <button type="submit" class="btn primary">💾 Save</button>
        </div>
      </form>
    </section>
  </main>
  <script src="leads.js"></script>
  <script src="popup.js"></script>
</body>
</html>
